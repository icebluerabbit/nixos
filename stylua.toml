# stylua — Lua formatting contract.
#
# Auto-discovered by walking up from the file being formatted, so treefmt
# (modules/formatter.nix), the pre-commit hook, nvim's conform-nvim and a bare
# `stylua` on the command line all read this same file. The treefmt module
# deliberately sets no `settings`, which would otherwise generate a competing
# stylua.toml in the store and pass it with --config-path.
#
# Indent matches .editorconfig's [*.lua]; StyLua does not read .editorconfig
# itself, so the two are kept in sync by hand.
column_width = 100
line_endings = "Unix"
indent_type = "Spaces"
indent_width = 2
quote_style = "AutoPreferDouble"
call_parentheses = "Always"
