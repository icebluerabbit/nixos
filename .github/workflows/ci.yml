name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

jobs:
  check:
    name: Lint & Verify
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v16

      - name: Magic Nix Cache
        uses: DeterminateSystems/magic-nix-cache-action@v8

      - name: Generate CI Runtime Config
        run: |
          cat <<-EOF > modules/ci-runtime.nix
          {
            _module.args.CI = true;
          }
          EOF

      - name: Check Flake schema & outputs
        run: nix flake check

      - name: Verify Formatting
        run: |
          nix fmt
          git diff --exit-code

      # golangci-lint needs the module graph rather than a file list, so it
      # cannot ride along in treefmt above. The race detector needs cgo, which
      # buildGoModule disables, so `go test -race` runs here rather than in the
      # derivation's checkPhase.
      - name: Lint, test and cover the Go workspace
        run: nix develop --command just go

      # Checked rather than committed: regenerating needs a full eval of the
      # server config, which is too slow for a pre-commit hook, and committing
      # from CI needs write access and races with concurrent pushes. `nix flake
      # check` above has already evaluated both hosts, so this is nearly free.
      - name: Verify topology docs are current
        run: |
          nix develop --command just topology
          git diff --exit-code || {
            echo "::error::README topology sections are stale — run 'just topology'"
            exit 1
          }
