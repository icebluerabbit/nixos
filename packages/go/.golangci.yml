# golangci-lint configuration for the packages/go workspace.
#
# Kept at the workspace root and applied to every module, so lib/, clients/ and
# tools/ are held to one standard. `just go-lint` runs it per module with
# GOWORK=off, matching how Nix builds them.
#
# Formatting is deliberately not configured here: gofmt runs through treefmt
# (see modules/formatter.nix) alongside every other language in the repo, and
# having two tools own it would let the pre-commit hook and this linter
# disagree.
version: "2"

linters:
  # standard = errcheck, govet, ineffassign, staticcheck, unused.
  default: standard
  enable:
    # Response bodies that are never closed leak connections in the
    # long-running tools, which is the failure mode that motivated a shared
    # HTTP client in the first place.
    - bodyclose
    # Enforces errors.Is/As over == and type assertions, which the
    # httpx.StatusError contract depends on.
    - errorlint
    # stdout belongs to a tool's product — rendered markdown, JSON lines for
    # Vector's exec source — and progress belongs in the logger. A stray
    # fmt.Println corrupts the output the day someone pipes it.
    - forbidigo
    - gocritic
    - gosec
    - misspell
    - revive

  settings:
    forbidigo:
      forbid:
        - pattern: ^fmt\.Print.*$
          msg: write to Env.Stdout for output, or Env.Logger for diagnostics
    revive:
      rules:
        - name: exported
        - name: package-comments
        - name: error-strings
        - name: context-as-argument
        - name: indent-error-flow
    misspell:
      # A hardlink is the thing this repo spends most of its time reasoning
      # about; "hardlinked" is not a typo for "hardline".
      ignore-rules:
        - hardlinked
    gocritic:
      enabled-tags:
        - diagnostic
        - style
      disabled-checks:
        # Both fire on the early-return style used throughout this repo.
        - ifElseChain
        - singleCaseSwitch

  exclusions:
    generated: lax
    rules:
      # Test code asserts on failures directly and builds throwaway requests;
      # the security and error-handling linters produce only noise there.
      - path: _test\.go$
        linters:
          - bodyclose
          - errcheck
          - gosec
      # Test helpers take *testing.T first. That is the convention the whole
      # standard library and every helper in this workspace follows, and it is
      # what makes t.Helper() at the top read correctly — revive's rule is
      # about production APIs.
      - path: _test\.go$
        linters:
          - revive
        text: "context-as-argument"
      # TableName is GORM's interface, not an API of ours. Its meaning is fixed
      # by the ORM and identical on all forty-odd models, so a comment on each
      # would restate the same sentence forty times; what the table IS is
      # documented on the type directly above it.
      - linters:
          - revive
        text: 'exported method \w+\.TableName should have comment'
      # `json:",squash"` is not a json option, and staticcheck is right that
      # encoding/json would ignore it — but nothing here unmarshals these
      # structs with encoding/json. lib/config drives koanf with Tag: "json",
      # so the json tag is read by mapstructure, whose option this is.
      #
      # Load-bearing rather than decorative: without squash, an embedded
      # sidecar.Config decodes as a field named "Config" and collides with the
      # framework's own --config flag. That collision crashlooped ten sidecars
      # once already.
      - linters:
          - staticcheck
        text: "SA5008.*squash"
